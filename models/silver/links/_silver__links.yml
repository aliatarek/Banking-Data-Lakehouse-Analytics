version: 2

models:
  - name: silver__link_customer_account
    description: Link between hub_customer and hub_account. Insert-only.
    columns:
      - name: hk_link_customer_account
        description: Hash key, MD5(CONCAT(hk_customer, hk_account)).
        tests:
          - unique
          - not_null
      - name: hk_customer
        description: FK to silver__hub_customer.
        tests:
          - relationships:
              arguments:
                to: ref('silver__hub_customer')
                field: hk_customer
      - name: hk_account
        description: FK to silver__hub_account.
        tests:
          - relationships:
              arguments:
                to: ref('silver__hub_account')
                field: hk_account
      - name: load_dts
        description: Timestamp this row was loaded into the link.
      - name: rec_src
        description: Source system identifier.

