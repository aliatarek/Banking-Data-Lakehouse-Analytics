version: 2

models:
  - name: silver__hub_customer
    description: Hub for the customer business entity. Insert-only, deduped on customer_id.
    columns:
      - name: hk_customer
        description: Hash key, MD5(UPPER(TRIM(customer_id))).
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Natural business key from bronze__customers.
        tests:
          - unique
          - not_null
      - name: load_dts
        description: Timestamp this row was loaded into the hub.
      - name: rec_src
        description: Source system identifier.

